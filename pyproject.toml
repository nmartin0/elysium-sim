[tool.ruff]
# 120, matching the Elysium project this was split out of, and for the
# same reason: the code here uses deliberately hand-placed formatting
# with multi-argument signatures broken across lines for readability,
# and 79 or 88 would fight that on every file.
line-length = 120
target-version = "py312"

# `ruff format` is deliberately never run, here or in lint.sh. The same
# decision as the parent project, carried over knowingly rather than by
# default: the other three tools each detect something objectively wrong
# (a real bug, a type mismatch, dead code), while reformatting has no
# correct answer, only a consistent one -- and the hand-placed wrapping
# in this codebase is authorial, not accidental. `ruff format --check`
# remains available to run by hand.
#
# vulture_whitelist.py is not ordinary executable Python -- it is a
# sequence of bare name references, which is Vulture's own required
# format. Ruff correctly flags every line as F821 and B018 from its own
# perspective; that is a false-positive class specific to this one file,
# not a reason to weaken those rules everywhere.
exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
#   E, W  -- pycodestyle
#   F     -- pyflakes (unused imports, undefined names)
#   I     -- import sorting, auto-fixable, no judgement calls
#   B     -- bugbear (mutable defaults, swallowed context, non-strict zip)
#   UP    -- pyupgrade, modernize to the target version
# Deliberately NOT the pylint-equivalent rules (complexity, docstring
# conventions, naming): the long explanatory docstrings in this codebase
# are intentional and those rules would generate persistent noise
# against choices that are deliberate.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
# Not scanning tests/ deliberately: fixtures lean on dynamic patterns
# that produce type-checker noise disproportionate to the value.
files = ["simulator", "scripts"]
ignore_missing_imports = true

[tool.vulture]
paths = ["simulator", "scripts", "tests", "vulture_whitelist.py"]
min_confidence = 60

[tool.importlinter]
root_packages = ["simulator"]

# The engine's internal shape, mapped against its real imports rather
# than designed from memory. clock and rng are the foundation: they
# import nothing of ours. scheduler sits on clock (its intensity curve
# is a function of time of day); lifecycle sits on rng (its competing-
# risks race draws from a stream).
#
# The two of them are SIBLINGS and must stay so. A scheduler that knew
# about entities, or a lifecycle that scheduled its own future events,
# would be the seam where the engine stops being composable -- and it is
# a tempting shortcut the moment a pack wants a transition to fire a
# delayed effect. The right answer there is for the simulation layer to
# own both, which is only enforceable if this contract holds.
#
# `|` between siblings, NOT `:`. They read almost identically and mean
# opposite things: in import-linter, a colon lists siblings that MAY
# import each other, a pipe lists siblings that may not. Written with a
# colon first, and the negative control caught it -- lifecycle importing
# scheduler left the contract reporting KEPT.
[[tool.importlinter.contracts]]
name = "engine layering: scheduler and lifecycle sit on clock and rng"
type = "layers"
layers = ["scheduler | lifecycle", "clock | rng"]
containers = ["simulator"]

# The silo layer. simulator.silo holds the contract and nothing else;
# the concrete kinds implement it and must never import each other.
#
# That sibling rule is the load-bearing half. MariaDbSilo and
# PostgresSilo have a similar SHAPE, and the tempting move the first
# time they both need something is for one to import from the other, or
# for a shared "sql base" to appear between them. Both would be wrong:
# they differ in initialisation, in whether a control program exists, in
# how shutdown is issued, and in how readiness is established. What they
# genuinely share is the Silo contract, and a contract is the only thing
# they should share.
#
# `|` between siblings, not `:`. A colon lists siblings that MAY import
# each other; a pipe lists siblings that may not. They read almost
# identically and mean opposite things, and a negative control caught
# that the wrong way round once already.
[[tool.importlinter.contracts]]
name = "concrete silos implement the contract and stay independent of each other"
type = "layers"
layers = ["postgres | mariadb | sqlite | filedrop"]
containers = ["simulator.silos"]

[[tool.importlinter.contracts]]
name = "the silo contract knows nothing about any concrete silo"
type = "forbidden"
source_modules = ["simulator.silo"]
forbidden_modules = ["simulator.silos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a real PostgreSQL binary on PATH are marked, so the
# suite still runs somewhere without one and says what it skipped
# rather than failing for an environmental reason.
markers = [
    "postgres: needs a real PostgreSQL installation (initdb, pg_ctl)",
    "mariadb: needs a real MariaDB or MySQL installation (mariadbd)",
]
